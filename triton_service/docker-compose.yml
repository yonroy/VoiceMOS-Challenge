version: "3.9"

services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile
    # CPU test mode: nạp đủ 3 track (explicit + 3 dòng --load-model).
    # Muốn chỉ Track 2 cho nhanh: bỏ 2 dòng load-model track1/track3.
    # Khi chạy GPU thật: có thể bỏ cả khối explicit/load-model (Triton mặc định nạp tất cả).
    command: >
      tritonserver
        --model-repository=/models
        --model-control-mode=explicit
        --load-model=track2_emotion
        --load-model=track1_acr
        --load-model=track3_sim
        --log-verbose=1
        --http-port=8000
        --grpc-port=8001
        --metrics-port=8002
    volumes:
      - ./model_repository:/models
      # Cache "sống dai" qua restart → tải UTMOS/WavLM/audeering 1 LẦN, lần sau dùng lại
      # (tránh tải lại 392M + ~1.2GB mỗi lần `up`, và tránh đứt giữa chừng).
      - hf_cache:/tmp/hf_home
      - torch_cache:/tmp/torch_home
      - model_cache:/tmp/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/tmp/hf_home
      - TORCH_HOME=/tmp/torch_home
      - MODELS_DIR=/tmp/models
    ports:
      - "8000:8000"   # Triton HTTP (KServe v2)
      - "8001:8001"   # Triton gRPC
      - "8002:8002"   # Triton metrics (Prometheus)
    # Python backend truyền tensor qua shared memory; batch nhiều audio dễ tràn
    # /dev/shm mặc định 64MB → nâng lên để tránh lỗi "Failed to increase shm".
    shm_size: "2gb"
    # CPU test mode: KHỐI GPU bên dưới đã được comment để Docker không đòi cấp GPU.
    # Khi chạy GPU thật: bỏ comment lại 6 dòng deploy/resources/... bên dưới.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Dùng python3 (chắc chắn có trong image -py3) thay vì curl (có thể thiếu).
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/v2/health/ready').status==200 else sys.exit(1)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - TRITON_URL=triton:8000
    ports:
      # Cổng host 8080 hay bị chiếm trên server dùng chung → mặc định 18080.
      # Đổi bằng env: GATEWAY_PORT=9090 docker compose up
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      triton:
        condition: service_healthy
    restart: unless-stopped

# Named volume giữ cache model qua các lần restart (xem service triton ở trên).
volumes:
  hf_cache:
  torch_cache:
  model_cache:
