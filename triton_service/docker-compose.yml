version: "3.9"

services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      tritonserver
        --model-repository=/models
        --log-verbose=1
        --http-port=8000
        --grpc-port=8001
        --metrics-port=8002
    volumes:
      - ./model_repository:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/tmp/hf_home
      - TORCH_HOME=/tmp/torch_home
      - MODELS_DIR=/tmp/models
    ports:
      - "8000:8000"   # Triton HTTP (KServe v2)
      - "8001:8001"   # Triton gRPC
      - "8002:8002"   # Triton metrics (Prometheus)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - TRITON_URL=triton:8000
    ports:
      - "8080:8080"
    depends_on:
      triton:
        condition: service_healthy
    restart: unless-stopped
